[project]
name = "agent-market-research"
version = "0.1.0"
description = "多智能体市场调研与营销内容生成系统（SDD/TDD）"
readme = "README.md"
# 3.11 起才有 datetime.UTC；spec/010 §6 也把目标定在 3.12，这里与规格对齐
requires-python = ">=3.12,<3.14"
dependencies = [
    "celery>=5.4",
    "crewai[tools]>=1.15.23,<2.0.0",
    "fastapi>=0.115",
    "mysql-connector-python>=9.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/amr"]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# src 布局：即使没有 editable 安装也能 import amr
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "real_llm: 需要真实模型网关与密钥（默认跳过，用 --run-real-llm 开启）",
    "system: 需要真实 MySQL/Redis/Worker 的系统测试",
]
filterwarnings = ["error::DeprecationWarning:amr.*"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
branch = true
source = ["src/amr"]
omit = ["src/amr/crews/*/config/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "RET", # return
    "ARG", # unused arguments
    "PTH", # pathlib
    "T20", # print
]
ignore = [
    "E501", # 行长交给 formatter
    "B008", # FastAPI 的 Depends() 默认参数是惯例
]

[tool.ruff.lint.per-file-ignores]
# ARG001/ARG002：替身实现协议方法时，用不到的入参是签名要求，不是疏漏
"tests/**" = ["ARG001", "ARG002", "S101"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
files = ["src/amr"]
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true

# 严格档位（按项开启，便于逐步收紧；不要整体 strict = true）
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
strict_equality = true
extra_checks = true
show_error_codes = true

# CrewAI 的 `@agent` / `@task` 用「config 里带 description/expected_output」的调用形式，
# 而 `Task.__init__` 的静态签名要求这两个参数显式传入——运行时由 config 补齐，
# 静态检查看不到，因此只放行这一类错误。
# 注意**不**放行 attr-defined：`agents_config` / `tasks_config` 已在类体内用
# TYPE_CHECKING 声明，属性名写错仍然应该被抓出来。
[[tool.mypy.overrides]]
module = ["amr.crews.market_analyst.crew", "amr.crews.content_creator.crew"]
disable_error_code = ["call-arg"]

# 第三方库无类型存根：只影响适配层，放行其 import
[[tool.mypy.overrides]]
module = [
    "celery.*",
    "crewai.*",
    "crewai_tools.*",
    "mysql.*",
    "mysql.connector.*",
    "redis.*",
]
ignore_missing_imports = true

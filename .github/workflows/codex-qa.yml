name: Codex QA

# 流水线里「CI 通知 QA Agent（Codex）」那一段的自动化（spec/000 §2.8–§2.9）。
#
# 它在 ci.yml 的 `open-pr` job 跑完之后接手：对刚推上 `bugfix` 的 commit 做 code review，
# 把 Findings 贴回 PR。开发 Agent 从 PR 里读 Findings，在 `bugfix` 上修完重推，本 workflow
# 再跑一轮——spec/000 §2.9 的循环就是这么转起来的。
#
# ⚠️ 为什么不用 `issue_comment` 监听那句 `@codex` 评论
# ---------------------------------------------------------------
# 这是本文件最容易踩、也最容易被后来的好心人「顺手改回去」的坑。
#
# `open-pr` job 里那句 `@codex …` 是**用 `GITHUB_TOKEN` 发的**，而 GitHub 明确规定：
# **`GITHUB_TOKEN` 产生的事件不会启动新的 workflow run**（防止递归触发）。
# 监听 `issue_comment` 等于监听一个永不触发的事件：运行记录里什么都没有，check 全绿，
# 唯一的症状是「Codex 从不出现」——而症状本身没有任何地方会报错。
#
# 同一条规则这一轮已经咬过两次：CI 自己开的 PR，其 `pull_request` 运行被扣在
# `action_required`（`branch-guard` 因此从不执行，PR 上永远显示 skipping）；
# 后来把 `branch-guard` 挂到 push 上才绕开。
#
# `workflow_run` 不走评论事件——它监听「某个 workflow 跑完了」，因此不受那条规则限制。
# 要改触发方式之前，先回读这段注释。

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# 只读内容：评审不需要写权限。**自动合并的授权不在这里**——合并 `development`
# 是 QA 的决定，需要人明确点头之后才加，别顺手把 contents 提成 write。
permissions:
  contents: read
  pull-requests: write

concurrency:
  # 按 sha 分组：同一次推送不重复跑；新推送取消旧评审（旧结论对新 sha 没意义）
  group: codex-qa-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    name: Codex 评审（spec/000 §2.9）
    # 只在「push 到 bugfix 且 ci.yml 全绿」之后跑。门禁红的时候不该请人评审——
    # 先让门禁说了算。fork/PR 事件进不来，所以这个 job 永远拿不到外部触发。
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'bugfix'
    runs-on: ubuntu-latest
    # 这是按 token 计费的，必须有刹车
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          # 评审的必须是被推上去的那个 sha，不是触发时 CI 分支的头（两者可能已经不同）
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Codex CLI
        # 钉版本：CLI 的参数与输出格式会变，而本 workflow 依赖 `-o` 与 `-s`。
        # 升级时改这里，并跑一次手动触发确认结论文件仍然产出。
        run: npm i -g @openai/codex@0.162.1

      - name: 写 Codex 配置（密钥只进进程，不落仓库）
        env:
          AMR_CODEX_KEY: ${{ secrets.AMR_CODEX_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AMR_CODEX_KEY}" ]; then
            echo "缺少 secret AMR_CODEX_KEY——先在仓库 Settings → Secrets 里配好" >&2
            exit 1
          fi
          mkdir -p "${HOME}/.codex"
          # 用 shell 变量展开而不是 ${{ }}：密钥只在进程环境里出现，
          # 不会被表达式替换写进脚本文本。
          cat > "${HOME}/.codex/config.toml" <<EOF
          model_provider = "amr"
          model = "deepseek-flash"
          model_reasoning_effort = "high"
          disable_response_storage = true
          web_search = "disabled"

          [model_providers.amr]
          name = "amr"
          base_url = "https://api.deepseek.com/"
          wire_api = "responses"
          experimental_bearer_token = "${AMR_CODEX_KEY}"
          EOF
          chmod 600 "${HOME}/.codex/config.toml"

      - name: 评审本次推送
        run: |
          set -euo pipefail
          git fetch --quiet origin development
          base="origin/development"
          echo "评审范围：${base}...HEAD（$(git rev-parse --short HEAD)）"

          set +e
          codex exec -s read-only -o /tmp/findings.md "$(cat <<'PROMPT'
          对当前仓库 HEAD 相对 origin/development 的改动做 code review（基线：git diff origin/development...HEAD）。

          按 spec/000-constitution.md 的分层红线与编码规范来审。输出 Findings，按 High / Medium / Low 分级，
          每条给出：文件、行号、问题、为什么是问题（尽量给具体复现路径或反例）、建议改法。
          判为 High 的，必须给出能证伪它的具体输入或 git 操作序列。
          没有发现就明确写「无 Finding」，不要为了凑数编问题。

          注意：本工作区是只读挂载，你跑不了测试。以静态推理为主，只靠推理得出的结论要明确标注。
          PROMPT
          )"
          code=$?
          set -e

          if [ "${code}" -ne 0 ] || [ ! -s /tmp/findings.md ]; then
            {
              echo "⚠️ Codex 没有产出结论（退出码 ${code}）。"
              echo
              echo "常见原因：\`AMR_CODEX_KEY\` 失效或额度用尽；端点不支持配置里的模型名。"
              echo "完整日志见本次运行的 Actions 页面。"
            } > /tmp/findings.md
          fi

      - name: 把结论贴回 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --head bugfix --base development --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "${number}" ]; then
            echo "没有打开的 PR（bugfix → development），跳过留言"
            exit 0
          fi

          {
            echo "## 🤖 Codex 自动评审 — \`${SHA:0:7}\`"
            echo
            cat /tmp/findings.md
            echo
            echo "---"
            echo "_由 \`.github/workflows/codex-qa.yml\` 自动触发（spec/000 §2.9）。_"
            echo "_Finding 请在 \`bugfix\` 上修复后重推，本 workflow 会自动再评审一轮。_"
          } > /tmp/comment.md

          gh pr comment "${number}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          echo "已把结论贴到 PR #${number}"

name: CI

# 多 Agent 交付流水线里属于 CI 的那一段（spec/000 §2）：
#   1. gate         —— 本地门禁在干净环境里再跑一遍（lint / type / test）
#   2. branch-guard —— 校验提升不变量：目标分支不能有源分支之外的提交
#   3. open-pr      —— push 到 bugfix 后自动开 PR 到 development，通知 QA Agent（Codex）
# Claude 不手动开 PR；development 由 Codex 操作；main 只接受人工合并。

on:
  push:
    branches: [bugfix]
  pull_request:
    branches: [development, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: 门禁（lint / type / test）
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      # 契约测试要在真实 MySQL 上验证 JobRepository 的实现（spec/040 §2.2）。
      # 本地没有 MySQL 时用例会 skip（NFR-001），但 CI 里不行：下面设了
      # AMR_REQUIRE_MYSQL=1，service 起不来就直接失败，避免「门禁绿但真库没验过」。
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: amr_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-root-password
      MYSQL_DATABASE: amr_test
      # CI 不碰真实模型网关；AMR_LLM_PROVIDER 缺省即 openai，但没有任何测试会真的调用它
      AMR_LOG_LEVEL: WARNING
      # 契约层的 MySQL 半边在 CI 里**必须真跑**：连不上就失败，而不是 skip。
      # 否则 service 起不来时门禁照样绿，而「终态防护只有真库才验得出来」就悄悄失效了。
      AMR_REQUIRE_MYSQL: "1"

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: 同步依赖
        run: uv sync --extra dev

      - name: lint（ruff check + format --check）
        run: make lint

      - name: type（mypy 严格模式）
        run: make type

      - name: test（单元 + 契约 + 集成）
        run: make test

      - name: 覆盖率（domain 与 services 需 ≥ 95%）
        run: make coverage

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  # 提升规则是 spec/000 §2 的核心约束，不能只写在文档里（§2.7）。这里和第二道门禁
  # 用**同一份实现**（scripts/check_promotion.py），避免出现「CI 一套规则、本地另一套」。
  branch-guard:
    name: 分支不变量（spec/000 §2）
    # 不能只挂 pull_request。CI 自己开出来的 PR 由 GITHUB_TOKEN 触发，那种运行会被
    # 扣在 action_required 等人工批准，一个 job 都不会执行——于是这道「机械校验」
    # 在最需要它的自动流程里从不运行（PR #1 的 run 38860330996 即此）。
    # push 到 bugfix 的运行不需要批准，而 gate 本来就是这么拿到 CI 覆盖的；
    # 不变量挂在同一处，才真的在改动落地那一刻被检查。
    if: >
      github.event_name == 'pull_request'
      || (github.event_name == 'push' && github.ref == 'refs/heads/bugfix')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 不变量要同时看到 base 与 head 两侧，而 checkout 在 PR 事件下只取当前 ref，
      # 所以显式把所有分支拉成远程跟踪引用（凭证由 checkout 持久化，fetch 直接复用）。
      - name: 拉全量分支引用
        run: git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'

      - name: 校验提升方向与「不带私货」
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          # PR 上比对 head/base；push 到 bugfix 时比对 bugfix/development。
          # `github.head_ref` / `github.base_ref` 只在 pull_request 事件里有值。
          if [ "${EVENT}" = "pull_request" ]; then
            source_ref="${HEAD_REF}"
            target_ref="${BASE_REF}"
          else
            source_ref="bugfix"
            target_ref="development"
          fi
          echo "校验提升边：${source_ref} → ${target_ref}"
          # --audit：CI 只核对不变量，不声明本次发布的版本号——这里也无从知道它。
          # 不给这个开关的话，base=main 的 PR 会永远卡在「发布边必须指定 --tag」上，
          # 那条 check 没有任何办法变绿。版本号是发布执行人在 §2.5 里的事。
          set +e
          python3 scripts/check_promotion.py --audit \
            "origin/${source_ref}" "origin/${target_ref}"
          code=$?
          set -e
          # 2 = 目标分支还不存在（新仓库第一次 push）：没有东西可校验，放过，
          # 否则依赖本 job 的 open-pr 会被连带 skip，那一步永远到不了，bootstrap 死锁。
          # 它和 0「校验通过」是两个码，所以上面那步不会把「跳过」伪装成「通过」。
          if [ "${code}" -eq 2 ]; then
            echo "目标分支还不存在，本轮没有可校验的提升（bootstrap）"
            exit 0
          fi
          exit "${code}"

  open-pr:
    name: 自动开 PR 到 development（通知 Codex）
    # 必须同时等 branch-guard：不变量破了还照常开 PR 并 @Codex 请求 review，
    # 等于「检查会失败」但「失败了不阻断」——§2.7 要的机械校验就成了摆设。
    needs: [gate, branch-guard]
    if: github.event_name == 'push' && github.ref == 'refs/heads/bugfix'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确保 development 分支存在
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/branches/development" >/dev/null 2>&1; then
            echo "development 已存在"
          else
            echo "development 不存在，从 main 创建"
            sha=$(git rev-parse origin/main)
            gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/heads/development" -f sha="${sha}"
          fi

      - name: 开或更新 PR（bugfix → development）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          sha=$(git rev-parse HEAD)
          short=$(git rev-parse --short HEAD)
          subject=$(git log -1 --pretty=%s)

          body=$(cat <<EOF
          ## 交棒给 QA（Codex）

          开发 Agent（Claude）已完成本轮改动并推送 \`bugfix\`，本地门禁与 CI 门禁均已通过。

          - commit: \`${short}\` — ${subject}
          - 分支: \`bugfix\` → \`development\`
          - 规格: 见仓库 \`spec/\`（唯一事实来源）；测试用例与需求追溯表见 \`spec/040-test-strategy.md\`

          ### 请 QA 完成
          1. code review（按 spec/000-constitution.md 的分层红线与编码规范）
          2. 系统测试（\`make test-system\`，需真实 MySQL/Redis；真实模型用 \`--run-real-llm\` 开启）
          3. 通过后合并到 \`development\`

          ### Finding 回传方式
          在 PR 里留 review 评论即可，开发 Agent 会在 \`bugfix\` 分支上继续修复并重推，
          直到 High 级别问题清零为止。

          🤖 Generated with [Claude Code](https://claude.com/claude-code)
          EOF
          )

          existing=$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --head bugfix --base development --state open --json number --jq '.[0].number // empty')

          if [ -n "${existing}" ]; then
            echo "PR #${existing} 已存在，更新描述"
            gh pr edit "${existing}" --repo "${GITHUB_REPOSITORY}" \
              --title "bugfix → development（${short}）" --body "${body}"
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" \
              --base development --head bugfix \
              --title "bugfix → development（${short}）" --body "${body}"
          fi

      - name: 在 PR 上留言通知 QA（Codex）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --head bugfix --base development --state open --json number --jq '.[0].number // empty')
          if [ -z "${number}" ]; then
            echo "没有找到打开的 PR，跳过留言"
            exit 0
          fi
          gh pr comment "${number}" --repo "${GITHUB_REPOSITORY}" --body \
            "@codex 门禁已全绿，请对 commit \`$(git rev-parse --short HEAD)\` 做 code review 与系统测试。Finding 请直接留评，我会在 \`bugfix\` 分支上修复后重推。"

  # 自动评审：对刚推上 `bugfix` 的 commit 做 code review，把结论贴回 PR。
  # 开发 Agent 从 PR 读 Findings、在 `bugfix` 上修、重推，本 job 再评审一轮——
  # spec/000 §2.9 的循环就是这么转起来的。
  #
  # ⚠️ 为什么放在 ci.yml 里，而不是单独一个 workflow 挂 `workflow_run`
  # ---------------------------------------------------------------
  # `workflow_run` 要求 workflow 文件**存在于默认分支**上。本仓库的 `main` 只接受
  # 人工发布，所以单独放一个 `workflow_run` workflow，等于要等它跟着
  # bugfix → development → main 走完一整圈才生效；在那之前 GitHub 只会给它一个
  # **名为文件路径的失败运行**（无 job、`event=push`、提示 "workflow file issue"），
  # 而文件本身完全合法——用一个 8 行的最小对照 workflow 实测确认过，同样的症状。
  #
  # 放进 ci.yml 跟着 push 触发就没这个问题：push 事件用的是**被推送的那个版本**的
  # workflow 文件，推上去立刻生效，不用等它上默认分支。
  #
  # 另一个已经踩过的坑：别改成监听 `issue_comment` 去接 `open-pr` 那句 `@codex`——
  # 那句评论是 `GITHUB_TOKEN` 发的，而 `GITHUB_TOKEN` 产生的事件**不会启动新的
  # workflow run**（防递归）。监听它等于监听一个永不触发的事件：运行记录空白、
  # check 全绿，唯一症状是「Codex 从不出现」。
  codex-review:
    name: Codex 自动评审（spec/000 §2.9）
    # 门禁绿了才请人评审——先让门禁说了算，也不白烧 token。
    needs: [gate, branch-guard]
    # 只在 push 到 bugfix 时跑；PR 事件上不重复跑（同一批 commit 已经评过）
    if: github.event_name == 'push' && github.ref == 'refs/heads/bugfix'
    runs-on: ubuntu-latest
    # 这是按 token 计费的，必须有刹车
    timeout-minutes: 25
    # job 级覆盖顶层：需要写 PR 评论，但**不碰 contents**——自动合并的授权不在这里，
    # 合并 `development` 是 QA 的决定，要人明确点头之后才加。
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装 Codex CLI
        # 钉版本：CLI 的参数与输出格式会变，而本 job 依赖 `-o` 与 `-s`。
        run: npm i -g @openai/codex@0.162.1

      - name: 写 Codex 配置（密钥只进进程，不落仓库）
        env:
          AMR_CODEX_KEY: ${{ secrets.AMR_CODEX_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${AMR_CODEX_KEY}" ]; then
            echo "AMR_CODEX_KEY 没有传进来（长度为 0）。常见原因，按概率排：" >&2
            echo "  1. 加成了 Variable 而不是 Secret——Settings → Secrets and variables" >&2
            echo "     → Actions 页面上有 Secrets / Variables 两个 tab，必须在 Secrets 里" >&2
            echo "  2. 名字不完全一致——要一字不差是 AMR_CODEX_KEY" >&2
            echo "  3. 加成了 Environment secret——那种要 job 里声明 environment: 才取得到" >&2
            exit 1
          fi
          # 只打印长度：既不泄露值，又能证明注入成功（排查时一眼看出是「没配」还是「配了但值不对」）
          echo "AMR_CODEX_KEY 已注入，长度 ${#AMR_CODEX_KEY}"
          mkdir -p "${HOME}/.codex"
          # 用 shell 变量展开而不是 GitHub 表达式语法：密钥只在进程环境里出现，
          # 不会被表达式替换写进脚本文本。
          #
          # 注意：**不要在 run 块里写出表达式语法的字面量**（哪怕是注释里）。
          # GitHub 会扫描 run 脚本内容中的表达式，空表达式会让整个 workflow
          # 校验失败——运行零 job、只提示 "workflow file issue"，
          # 而文件本身 YAML 解析完全正常。这个坑真踩过。
          cat > "${HOME}/.codex/config.toml" <<EOF
          model_provider = "amr"
          model = "deepseek-flash"
          model_reasoning_effort = "high"
          disable_response_storage = true
          web_search = "disabled"

          [model_providers.amr]
          name = "amr"
          base_url = "https://api.deepseek.com/"
          wire_api = "responses"
          experimental_bearer_token = "${AMR_CODEX_KEY}"
          EOF
          chmod 600 "${HOME}/.codex/config.toml"

      - name: 评审本次推送
        run: |
          set -euo pipefail
          git fetch --quiet origin development
          base="origin/development"
          echo "评审范围：${base}...HEAD（$(git rev-parse --short HEAD)）"

          set +e
          codex exec -s read-only -o /tmp/findings.md "$(cat <<'PROMPT'
          对当前仓库 HEAD 相对 origin/development 的改动做 code review（基线：git diff origin/development...HEAD）。

          按 spec/000-constitution.md 的分层红线与编码规范来审。输出 Findings，按 High / Medium / Low 分级，
          每条给出：文件、行号、问题、为什么是问题（尽量给具体复现路径或反例）、建议改法。
          判为 High 的，必须给出能证伪它的具体输入或 git 操作序列。
          没有发现就明确写「无 Finding」，不要为了凑数编问题。

          注意：你在 CI runner 上，可以跑只读命令与测试；跑不了的检查要明确说明。
          PROMPT
          )"
          code=$?
          set -e

          if [ "${code}" -ne 0 ] || [ ! -s /tmp/findings.md ]; then
            {
              echo "⚠️ Codex 没有产出结论（退出码 ${code}）。"
              echo
              echo "常见原因：\`AMR_CODEX_KEY\` 失效或额度用尽；端点不支持配置里的模型名。"
              echo "完整日志见本次运行的 Actions 页面。"
            } > /tmp/findings.md
          fi

      - name: 把结论贴回 PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number=$(gh pr list --repo "${GITHUB_REPOSITORY}" \
            --head bugfix --base development --state open \
            --json number --jq '.[0].number // empty')
          if [ -z "${number}" ]; then
            echo "没有打开的 PR（bugfix → development），跳过留言"
            exit 0
          fi

          {
            echo "## 🤖 Codex 自动评审 — \`$(git rev-parse --short HEAD)\`"
            echo
            cat /tmp/findings.md
            echo
            echo "---"
            echo "_由 ci.yml 的 \`codex-review\` job 自动触发（spec/000 §2.9）。_"
            echo "_Finding 请在 \`bugfix\` 上修复后重推，本 job 会自动再评审一轮。_"
          } > /tmp/comment.md

          gh pr comment "${number}" --repo "${GITHUB_REPOSITORY}" --body-file /tmp/comment.md
          echo "已把结论贴到 PR #${number}"
